<style>

/* =========================
   BASE
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f6fa;
    color:#333;
    padding:20px;
}

.app{
    max-width:1100px;
    margin:auto;
}

/* =========================
   PANEL HEADER
========================= */

.panel-header{
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.panel-header h2{
    margin-bottom:15px;
    color:#1a73e8;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

input[type="date"],
input[type="text"]{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

input[type="text"]{
    width:100%;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#1a73e8;
    color:#fff;
    font-size:14px;
    transition:.2s;
}

button:hover{
    background:#1558b0;
}

/* =========================
   ESTADO (NUEVO SISTEMA)
========================= */

.estado{
    padding:14px 16px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:500;
}

.estado.loading{
    background:#e8f0fe;
    color:#1a73e8;
}

.estado.error{
    background:#fdecea;
    color:#b00020;
}

.estado.ok{
    background:#e6f4ea;
    color:#1e8e3e;
}

/* =========================
   SUCURSAL - CARD ACORDEÓN
========================= */

.sucursal-card{
    background:#fff;
    border:1px solid #dfe3eb;
    border-radius:9px;
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.sucursal-titulo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    padding:13px 16px;

    background:#fff;
    color:#333;

    cursor:pointer;
    user-select:none;

    border-bottom:1px solid transparent;

    transition:background .2s;
}

.sucursal-titulo:hover{
    background:#f7faff;
}

.sucursal-card.abierta
.sucursal-titulo{
    border-bottom-color:#e7ebf1;
}


/* Identidad de sucursal */

.sucursal-identidad{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.sucursal-icono{
    color:#1a73e8;
    font-size:18px;
}

.sucursal-nombre{
    color:#1a73e8;
    font-size:17px;
    font-weight:bold;
    text-transform:uppercase;
}


/* Contador y flecha */

.sucursal-info{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
}

.sucursal-contador{
    padding:4px 12px;

    background:#1a73e8;
    color:#fff;

    border-radius:15px;

    font-size:12px;
    font-weight:bold;
}

.sucursal-flecha{
    color:#6b7280;
    font-size:12px;
    transition:transform .25s ease;
}

.sucursal-card.abierta
.sucursal-flecha{
    transform:rotate(180deg);
}


/* Contenido del acordeón */

.sucursal-contenido{
    max-height:0;

    overflow:hidden;

    padding:0 14px;

    transition:
        max-height .35s ease,
        padding .35s ease;
}

.sucursal-card.abierta
.sucursal-contenido{
    max-height:5000px;
    padding:13px 14px 15px;
}


/* =========================
   CARD POR ASESOR
========================= */

.asesor-card{
    background:#f8f9fd;

    border:1px solid #dfe3eb;

    border-radius:7px;

    padding:11px;

    margin-bottom:12px;
}

.asesor-card:last-child{
    margin-bottom:0;
}

.asesor-encabezado{
    display:flex;
    align-items:center;
    gap:10px;

    padding-bottom:9px;
    margin-bottom:10px;

    border-bottom:1px solid #dfe3eb;
}

.asesor-icono{
    background:none;
    color:#1a73e8;
    width:auto;
    height:auto;
    border-radius:0;
    font-size:16px;
    flex-shrink:0;
}

.asesor-nombre{
    flex:1;
    min-width:0;

    color:#5f6368;

    font-size:14px;
    font-weight:bold;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.asesor-contador{
    flex-shrink:0;

    padding:3px 9px;

    background:#e8f0fe;
    color:#5f6368;

    border-radius:12px;

    font-size:11px;
    font-weight:bold;
}


/* =========================
   TABLA
========================= */

.tabla-contenedor{
    width:100%;

    overflow-x:auto;

    background:#fff;

    border:1px solid #e5e9ef;
    border-radius:6px;

    box-shadow:0 1px 4px
        rgba(0,0,0,.03);
}

table{
    width:100%;

    min-width:720px;

    border-collapse:collapse;

    font-size:13px;
}

th{
    padding:10px 12px;

    background:linear-gradient(
        135deg,
        #1a73e8 0%,
        #0d61cb 100%
    );

    color:#fff;

    text-align:left;

    font-size:12px;
    font-weight:bold;

    white-space:nowrap;
}

td{
    padding:10px 12px;

    border-bottom:1px solid #edf0f4;

    vertical-align:middle;

    line-height:1.35;
}

tbody tr:last-child td{
    border-bottom:none;
}

tbody tr:hover{
    background:#f1f8ff;
}


/* Anchura de columnas */

.col-cliente{
    width:36%;
    min-width:190px;
}

td.col-cliente{
    font-weight:bold;
}

.col-proceso{
    width:24%;
    min-width:135px;
}

.col-oficina{
    width:22%;
    min-width:135px;
}

.col-estado{
    width:18%;
    min-width:125px;
}


/* =========================
   BADGES DE ESTADO
========================= */

.estado-cita{
    display:inline-block;

    padding:4px 9px;

    border-radius:14px;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    white-space:nowrap;
}


/* En espera */

.estado-espera{
    background:#e8f0fe;
    color:#1a73e8;
}


/* Reprogramada */

.estado-reprogramada{
    background:#fff8e1;
    color:#f57c00;
}


/* Venta cerrada */

.estado-venta{
    background:#e8f5e9;
    color:#1e8e3e;
}


/* Cancelada */

.estado-cancelada{
    background:#ffebee;
    color:#d93025;
}


/* Sin respuesta */

.estado-sin-respuesta{
    background:#f3e8ff;
    color:#7e22ce;
}


/* BO */

.estado-bo{
    background:#eceff1;
    color:#455a64;
}

/* =========================
   SIN REGISTROS
========================= */

.sin-registros{
    text-align:center;
    padding:40px;
    color:#666;
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .toolbar{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    table{
        font-size:13px;
    }

    th, td{
        padding:7px;
    }

        .sucursal-titulo{
        align-items:flex-start;
        padding:12px;
    }

    .sucursal-nombre{
        font-size:14px;
    }

    .sucursal-info{
        gap:6px;
    }

    .sucursal-contador{
        padding:4px 8px;
        font-size:10px;
    }

    .sucursal-contenido{
        padding-left:8px;
        padding-right:8px;
    }

    .sucursal-card.abierta
    .sucursal-contenido{
        padding:10px 8px 12px;
    }

    .asesor-card{
        padding:8px;
    }

    .asesor-nombre{
        font-size:13px;
    }

    table{
        min-width:650px;
        font-size:12px;
    }

    th,
    td{
        padding:8px 9px;
    }
}

.resumen-general{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.resumen-general h3{
    margin-bottom:15px;
    color:#1a73e8;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.kpi{
    background:#f5f6fa;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.kpi .num{
    font-size:26px;
    font-weight:bold;
    color:#1a73e8;
}

.listas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.lista{
    padding:12px;
    border-radius:8px;
}

.lista h4{
    margin-bottom:8px;
}

.lista span{
    display:inline-block;
    padding:4px 8px;
    margin:3px;
    border-radius:20px;
    font-size:12px;
}

.lista.verde{
    background:#e6f4ea;
    color:#1e8e3e;
}

.lista.verde span{
    background:#34a853;
    color:#fff;
}

.lista.rojo{
    background:#fdecea;
    color:#b00020;
}

.lista.rojo span{
    background:#ea4335;
    color:#fff;
}

@media(max-width:700px){
    .kpis{
        grid-template-columns:1fr;
    }

    .listas{
        grid-template-columns:1fr;
    }
}

</style>
