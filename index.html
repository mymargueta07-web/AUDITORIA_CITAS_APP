  <script>
    let datosGlobales = {};

let sucursalesSeleccionadas = [];
let sucursalesDisponibles = [];

/**
 * Evita guardar nuevamente una cita
 * hasta que el formulario sea limpiado.
 */
let citaGuardadaPendienteLimpieza = false;
let guardadoEnCurso = false;
let duplicadoPendiente = null;
let operationIdCitaActual = null;
let reintentoSincronizacionCitaPendiente = null;

function generarOperationIdCita() {
  const cripto = window.crypto;

  if (!cripto || typeof cripto.getRandomValues !== 'function') {
    throw new Error(
      'El navegador no permite generar un identificador seguro para la cita.'
    );
  }

  if (typeof cripto.randomUUID === 'function') {
    return cripto.randomUUID();
  }

  const bytes = new Uint8Array(16);
  cripto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;

  const hexadecimal = Array.from(bytes, function(valor) {
    return valor.toString(16).padStart(2, '0');
  });

  return (
    hexadecimal.slice(0, 4).join('') + '-' +
    hexadecimal.slice(4, 6).join('') + '-' +
    hexadecimal.slice(6, 8).join('') + '-' +
    hexadecimal.slice(8, 10).join('') + '-' +
    hexadecimal.slice(10, 16).join('')
  );
}

function obtenerOperationIdCitaActual() {
  if (!operationIdCitaActual) {
    operationIdCitaActual = generarOperationIdCita();
  }

  return operationIdCitaActual;
}

  function cargarDatosIniciales() {
    google.script.run
      .withSuccessHandler(function(data) {
        datosGlobales = data;
        const selectOrigen = document.getElementById('sucursalOrigen');
        selectOrigen.innerHTML = '<option value="">-- Seleccione sucursal --</option>';
        data.sucursalesOrigen.forEach(suc => {
          const option = document.createElement('option');
          option.value = suc;
          option.textContent = suc;
          selectOrigen.appendChild(option);
        });
        generarListaSucursales(data.sucursalesDestino);

inicializarMultiSelect();
        llenarSelect('proceso', data.opcionesProceso);
        llenarSelect('origen', data.opcionesOrigen);
      })
      .withFailureHandler(function(error) {
        mostrarMensaje('Error al cargar datos: ' + error.message, 'error');
      })
      .obtenerDatosIniciales();
  }
  
  function generarListaSucursales(sucursales) {

  sucursalesDisponibles = [...sucursales];

  const lista = document.getElementById("listaSucursales");

  lista.innerHTML = "";

  sucursales.forEach(nombre => {

    const fila = document.createElement("label");

    fila.className = "multi-option";

    fila.dataset.nombre = nombre.toLowerCase();

    fila.innerHTML = `
      <input type="checkbox" value="${nombre}">
      <span>${nombre}</span>
    `;

    const check = fila.querySelector("input");

    check.addEventListener("change", function(){

      if(this.checked){

        if(!sucursalesSeleccionadas.includes(nombre))
          sucursalesSeleccionadas.push(nombre);

      }else{

        sucursalesSeleccionadas =
          sucursalesSeleccionadas.filter(s=>s!==nombre);

      }

      actualizarChips();

    });

    lista.appendChild(fila);

  });

}

function actualizarChips(){

  const contenedor =
      document.getElementById("sucursalesSeleccionadas");

  const texto =
      document.getElementById("multiSucursalTexto");

  contenedor.innerHTML = "";

  if(sucursalesSeleccionadas.length===0){

      texto.textContent =
      "Seleccione una o varias sucursales";

      return;

  }

  texto.textContent =
      sucursalesSeleccionadas.length +
      " sucursal(es) seleccionada(s)";

  sucursalesSeleccionadas.forEach(nombre=>{

      const chip=document.createElement("div");

      chip.className="multi-chip";

      chip.innerHTML=`
      ${nombre}
      <span>&times;</span>
      `;

      chip.querySelector("span")
      .addEventListener("click",function(e){

          e.stopPropagation();

          sucursalesSeleccionadas =
          sucursalesSeleccionadas.filter(s=>s!==nombre);

          document
          .querySelectorAll("#listaSucursales input")
          .forEach(c=>{

              if(c.value===nombre)
                  c.checked=false;

          });

          actualizarChips();

      });

      contenedor.appendChild(chip);

  });

}
  
  
function inicializarMultiSelect(){

const multi=document.getElementById("multiSucursal");

const caja=document.getElementById("multiSucursalBox");

const buscador=document.getElementById("buscarSucursal");

caja.addEventListener("click",function(e){

e.stopPropagation();

multi.classList.toggle("open");

if(multi.classList.contains("open")){

  function obtenerHoraCitaFormulario() {
    const hora = document.getElementById('horaCitaHora').value;
    const minuto = document.getElementById('horaCitaMinuto').value;
    const periodo = document.getElementById('horaCitaPeriodo').value;

    if (!hora && !minuto && !periodo) {
      return {
        valida: true,
        valor: ''
      };
    }

    if (!hora || !minuto || !periodo) {
      return {
        valida: false,
        mensaje: 'Complete la hora, minutos y AM/PM.'
      };
    }

    return {
      valida: true,
      valor: hora.padStart(2, '0') + ':' + minuto + ' ' + periodo
    };
  }

  function mostrarErrorHoraCita(mensaje) {
    const error = document.getElementById('horaCitaError');
    error.textContent = mensaje || '';
    error.style.display = mensaje ? 'block' : 'none';
  }

  function actualizarErrorHoraCita() {
    const resultado = obtenerHoraCitaFormulario();
    mostrarErrorHoraCita(
      resultado.valida ? '' : resultado.mensaje
    );
  }
  
  function toggleFechaCita() {
    const chk = document.getElementById('citaAbierta');
    const dateInput = document.getElementById('fechaCita');
    const selectoresHora = [
      document.getElementById('horaCitaHora'),
      document.getElementById('horaCitaMinuto'),
      document.getElementById('horaCitaPeriodo')
    ];

    if (chk.checked) {
      dateInput.disabled = true;
      dateInput.value = '';
      selectoresHora.forEach(function(selector) {
        selector.value = '';
        selector.disabled = true;
      });
      mostrarErrorHoraCita('');
    } else {
      dateInput.disabled = false;
      selectoresHora.forEach(function(selector) {
        selector.disabled = false;
      });
    }
  }
  
  function enviarFormulario(event) {

  event.preventDefault();

  const btn = document.getElementById('btnGuardar');

  // =====================================================
  // BLOQUEO DE DOBLE REGISTRO
  // =====================================================

  if (citaGuardadaPendienteLimpieza) {

    mostrarMensaje(
      'Esta cita ya fue guardada. Presione "Limpiar Form" antes de registrar una nueva cita.',
      'error'
    );

    return;

  }

  if (guardadoEnCurso) {
    return;
  }

  if (reintentoSincronizacionCitaPendiente) {
    const contexto = reintentoSincronizacionCitaPendiente;

    guardadoEnCurso = true;
    btn.disabled = true;
    btn.innerHTML = 'Reintentando... <span class="loading"></span>';

    ejecutarGuardado(
      contexto.datos,
      btn,
      contexto.originalText,
      contexto.hora
    );
    return;
  }


  const sucursalOrigen =
    document.getElementById('sucursalOrigen').value;

  const asesor =
    document.getElementById('asesor').value;

  const cliente =
    document.getElementById('cliente').value.trim();

  const numero =
    document.getElementById('numero').value.trim();

  let proceso =
    document.getElementById('proceso').value;

  const precio =
    document.getElementById('precio').value.trim();

  let origen =
    document.getElementById('origen').value;

  const extras =
    document.getElementById('extras').value.trim();

  const nota =
    document.getElementById('nota').value.trim();

  const sucursalesElegidas = [
    ...sucursalesSeleccionadas
  ];

  const citaAbierta =
    document.getElementById('citaAbierta').checked;

  const fechaInput =
    document.getElementById('fechaCita').value;

  const resultadoHora = obtenerHoraCitaFormulario();

  if (!resultadoHora.valida) {
    mostrarErrorHoraCita(resultadoHora.mensaje);
    return;
  }

  const horaParaGuardar =
    resultadoHora.valor;

  const horaParaResumen =
    horaParaGuardar || 'No especificada';


  // =====================================================
  // VALIDACIONES
  // =====================================================

  if (!sucursalOrigen) {

    mostrarMensaje(
      'Seleccione la Sucursal Origen',
      'error'
    );

    return;

  }


  if (!asesor) {

    mostrarMensaje(
      'Seleccione el Asesor',
      'error'
    );

    return;

  }


  if (!cliente) {

    mostrarMensaje(
      'Ingrese el nombre del cliente',
      'error'
    );

    return;

  }


  if (!numero) {

    mostrarMensaje(
      'Ingrese el número de contacto',
      'error'
    );

    return;

  }


  if (
    !proceso ||
    proceso === '-- Seleccione --'
  ) {

    mostrarMensaje(
      'Seleccione un proceso válido',
      'error'
    );

    return;

  }


  if (!precio) {

    mostrarMensaje(
      'Ingrese el precio ofrecido o "pendiente"',
      'error'
    );

    return;

  }


  if (
    !origen ||
    origen === '-- Seleccione --'
  ) {

    mostrarMensaje(
      'Seleccione el origen del contacto',
      'error'
    );

    return;

  }


  if (sucursalesElegidas.length === 0) {

    mostrarMensaje(
      'Seleccione al menos una sucursal destino',
      'error'
    );

    return;

  }


  // =====================================================
  // FECHA
  // =====================================================

  let fechaFinal = '';

  if (citaAbierta) {

    fechaFinal = 'cita abierta';

  } else {

    if (!fechaInput) {

      mostrarMensaje(
        'Seleccione una fecha o marque "Cita abierta"',
        'error'
      );

      return;

    }


    const partesFecha = fechaInput.split('-');

const anio = partesFecha[0];
const mes = partesFecha[1];
const dia = partesFecha[2];

fechaFinal = `${dia}/${mes}/${anio}`;

  }


  // =====================================================
  // PROCESO OTRO
  // =====================================================

  if (proceso === 'Otro') {

    const otroTexto =
      document
        .getElementById('otroProcesoText')
        .value
        .trim();

    if (!otroTexto) {

      mostrarMensaje(
        'Especifique el proceso en el campo "Otro"',
        'error'
      );

      return;

    }

    proceso = otroTexto;

  }


  // =====================================================
  // ORIGEN OTRO
  // =====================================================

  if (origen === 'Otro') {

    const otroOrigen =
      document
        .getElementById('otroOrigenText')
        .value
        .trim();

    if (!otroOrigen) {

      mostrarMensaje(
        'Especifique el origen en el campo "Otro"',
        'error'
      );

      return;

    }

    origen = otroOrigen;

  }


  // =====================================================
  // DATOS
  // =====================================================

  let operationId;

  try {
    operationId = obtenerOperationIdCitaActual();
  } catch (error) {
    mostrarMensaje(error.message || error.toString(), 'error');
    return;
  }

  const datos = {

    operationId: operationId,

    cliente: cliente,

    proceso: proceso,

    numero: numero,

    precio: precio,

    extras: extras,

    fecha: fechaFinal,

    hora: horaParaGuardar,

    sucursalDestino:
      sucursalesElegidas.join(', '),

    asesor: asesor,

    nota: nota,

    origen: origen,

    sucursalOrigen: sucursalOrigen

  };


  // =====================================================
  // GUARDAR
  // =====================================================

  const originalText = btn.innerText;

  guardadoEnCurso = true;

  btn.disabled = true;

  btn.innerHTML =
    'Guardando... <span class="loading"></span>';

  ejecutarGuardado(datos, btn, originalText, horaParaResumen);

}

  function ejecutarGuardado(datos, btn, originalText, hora) {

  google.script.run

    .withSuccessHandler(function(respuesta) {

      if (respuesta.exito) {

        if (respuesta.sincronizacionSupabase === 'ERROR') {
          procesarGuardadoPendienteSincronizacion(
            datos,
            btn,
            hora
          );
        } else {
          procesarGuardadoExitoso(respuesta, datos, btn, hora);
        }

      } else {

        guardadoEnCurso = false;

        if (respuesta.duplicado) {
          duplicadoPendiente = {
            datos: datos,
            btn: btn,
            originalText: originalText,
            hora: hora
          };
          mostrarModalDuplicado(respuesta.coincidencias || [], datos);
          return;
        }

        mostrarMensaje(
          'Error: ' + respuesta.mensaje,
          'error'
        );

        // Permitir intentar nuevamente
        btn.disabled = false;

        btn.innerText = originalText;

      }

    })

    .withFailureHandler(function(error) {

      guardadoEnCurso = false;

      mostrarMensaje(
        'Error de conexión: ' + error.message,
        'error'
      );

      // Como no sabemos si se guardó correctamente,
      // permitimos nuevamente el botón.
      btn.disabled = false;

      btn.innerText = originalText;

    })

    .guardarCita(datos);

}

  function mostrarModalDuplicado(coincidencias, datosOriginales) {
    cerrarModalDuplicado();

    const overlay = document.createElement('div');
    overlay.id = 'duplicadoModalOverlay';
    overlay.className = 'duplicado-modal-overlay';

    const modal = document.createElement('div');
    modal.className = 'duplicado-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'duplicadoModalTitulo');

    const titulo = document.createElement('h2');
    titulo.id = 'duplicadoModalTitulo';
    titulo.textContent = 'Ya existe una posible cita duplicada';
    modal.appendChild(titulo);

    const contenido = document.createElement('div');
    contenido.className = 'duplicado-modal-contenido';

    coincidencias.forEach(function(cita) {
      const detalle = document.createElement('div');
      detalle.className = 'duplicado-modal-coincidencia';
      detalle.textContent =
        'ID: ' + (cita.id || '') + '\n' +
        'Cliente: ' + (cita.cliente || '') + '\n' +
        'Número: ' + (cita.numero || '') + '\n' +
        'Proceso: ' + (cita.proceso || '') + '\n' +
        'Fecha: ' + (cita.fecha || '') + '\n' +
        'Sucursal origen: ' + (cita.sucursalOrigen || '') + '\n' +
        'Sucursal destino: ' + (cita.sucursalDestino || '') + '\n' +
        'Asesor: ' + (cita.asesor || '') + '\n' +
        'Estado: ' + (cita.estado || '');
      contenido.appendChild(detalle);
    });

    modal.appendChild(contenido);

    const acciones = document.createElement('div');
    acciones.className = 'duplicado-modal-acciones';

    const cancelar = document.createElement('button');
    cancelar.type = 'button';
    cancelar.className = 'duplicado-modal-cancelar';
    cancelar.textContent = 'Cancelar';

    const forzar = document.createElement('button');
    forzar.type = 'button';
    forzar.className = 'duplicado-modal-confirmar';
    forzar.textContent = 'Guardar de todos modos';

    acciones.appendChild(cancelar);
    acciones.appendChild(forzar);
    modal.appendChild(acciones);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    cancelar.addEventListener('click', cancelarGuardadoDuplicado);
    forzar.addEventListener('click', confirmarGuardadoDuplicado);
    document.body.style.overflow = 'hidden';
    cancelar.focus();
  }

  function cerrarModalDuplicado() {
    const overlay = document.getElementById('duplicadoModalOverlay');
    if (overlay) {
      overlay.remove();
    }
    document.body.style.overflow = '';
  }

  function cancelarGuardadoDuplicado() {
    const contexto = duplicadoPendiente;
    cerrarModalDuplicado();
    guardadoEnCurso = false;

    if (contexto) {
      contexto.btn.disabled = false;
      contexto.btn.innerText = contexto.originalText;
    }

    duplicadoPendiente = null;
    operationIdCitaActual = null;
  }

  function confirmarGuardadoDuplicado() {
    if (guardadoEnCurso || !duplicadoPendiente) {
      return;
    }

    const contexto = duplicadoPendiente;
    guardadoEnCurso = true;
    contexto.datos.forzarDuplicado = true;
    contexto.btn.disabled = true;
    contexto.btn.innerHTML = 'Guardando... <span class="loading"></span>';
    cerrarModalDuplicado();
    duplicadoPendiente = null;

    ejecutarGuardado(
      contexto.datos,
      contexto.btn,
      contexto.originalText,
      contexto.hora
    );
  }

  function procesarGuardadoPendienteSincronizacion(
    datos,
    btn,
    hora
  ) {
    cerrarModalDuplicado();
    duplicadoPendiente = null;
    operationIdCitaActual = datos.operationId;
    reintentoSincronizacionCitaPendiente = {
      datos: Object.assign({}, datos),
      originalText: 'Reintentar sincronización',
      hora: hora
    };
    citaGuardadaPendienteLimpieza = false;
    guardadoEnCurso = false;

    mostrarMensaje(
      'Cita registrada correctamente. La sincronización está pendiente; puedes intentar nuevamente.',
      'success'
    );

    btn.disabled = false;
    btn.innerText = 'Reintentar sincronización';
  }

  function procesarGuardadoExitoso(respuesta, datos, btn, hora) {
    cerrarModalDuplicado();
    duplicadoPendiente = null;
    reintentoSincronizacionCitaPendiente = null;
    operationIdCitaActual = null;
    citaGuardadaPendienteLimpieza = true;

    mostrarResumenCita(
      datos,
      hora,
      respuesta.id
    );

    btn.disabled = true;
    btn.innerText = 'Cita guardada';
  }
  
  function mostrarResumenCita(datos, hora, id) {

    const cabecera = `CITA AGENDADA - ${id}`;

    const texto = [
      cabecera,
      `CLIENTE: ${datos.cliente}`,
      `PROCESO: ${datos.proceso}`,
      `PRECIO: ${datos.precio}`,
      `EXTRAS: ${datos.extras || 'Ninguno'}`,
      `FECHA: ${datos.fecha}`,
      `HORA: ${hora || 'No especificada'}`,
      `SUCURSAL: ${datos.sucursalDestino}`,
      `ASESOR: ${datos.asesor}`,
      `NOTA: ${datos.nota || 'Ninguna'}`,
      `ORIGEN: ${datos.origen}`,
      `SUCURSAL ORIGEN: ${datos.sucursalOrigen}`
    ].join('\n');

    const textoCompacto = String(texto || '')
      .replace(/\r\n/g, '\n')
      .replace(/\n[ \t]*\n+/g, '\n')
      .trim();

    const msgDiv = document.getElementById('mensaje');

    msgDiv.innerHTML = `
      <div class="resumen-cita"></div>

      <div class="acciones-resumen">

        <button
          type="button"
          id="btnCopiarTexto"
          class="btn-copiar">
          📋 Copiar texto
        </button>

        <button
          type="button"
          id="btnLimpiarForm"
          class="btn-limpiar">
          Limpiar Form
        </button>

      </div>
    `;

    msgDiv.className = 'message success';
    msgDiv.style.display = 'block';

    msgDiv
      .querySelector('.resumen-cita')
      .textContent = textoCompacto;

    document
      .getElementById('btnCopiarTexto')
      .addEventListener('click', function(event) {

        event.preventDefault();
        event.stopPropagation();

        copiarTexto(textoCompacto);

      });

    document
      .getElementById('btnLimpiarForm')
      .addEventListener('click', function(event) {

        event.preventDefault();
        event.stopPropagation();

        limpiarFormulario();

      });

  }

  function limpiarFormulario() {
// Permitir un nuevo registro
citaGuardadaPendienteLimpieza = false;
guardadoEnCurso = false;
operationIdCitaActual = null;
reintentoSincronizacionCitaPendiente = null;

    // Resetear formulario principal
    document.getElementById('citaForm').reset();

    // Reiniciar selector múltiple
    sucursalesSeleccionadas = [];

    document
      .querySelectorAll("#listaSucursales input")
      .forEach(cb => {
        cb.checked = false;
      });

    // Limpiar buscador de sucursal
    document.getElementById("buscarSucursal").value = "";

    // Mostrar nuevamente todas las sucursales
    document
      .querySelectorAll(".multi-option")
      .forEach(op => {
        op.style.display = "flex";
      });

    // Actualizar chips
    actualizarChips();

    // Cerrar selector múltiple
    document
      .getElementById("multiSucursal")
      .classList.remove("open");

    // Reiniciar selector de asesor
    const selectAsesor = document.getElementById('asesor');

    selectAsesor.innerHTML =
      '<option value="">-- Primero elija sucursal --</option>';

    selectAsesor.disabled = true;

    // Ocultar campos "Otro"
    document.getElementById('otroProcesoDiv').style.display = 'none';
    document.getElementById('otroOrigenDiv').style.display = 'none';

    document.getElementById('otroProcesoText').required = false;
    document.getElementById('otroOrigenText').required = false;

    // Reiniciar fecha
    document.getElementById('citaAbierta').checked = false;
    document.getElementById('fechaCita').disabled = false;
    ['horaCitaHora', 'horaCitaMinuto', 'horaCitaPeriodo']
      .forEach(function(id) {
        const selector = document.getElementById(id);
        selector.value = '';
        selector.disabled = false;
      });
    mostrarErrorHoraCita('');

    // Ocultar resumen anterior
    const mensaje = document.getElementById('mensaje');

    mensaje.innerHTML = "";
    mensaje.style.display = "none";

    const btnGuardar =
  document.getElementById('btnGuardar');

btnGuardar.disabled = false;
btnGuardar.innerText = '✅ Guardar cita';

    // Llevar al inicio de la página
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  function copiarTexto(texto) {
    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopiarTexto');
      if (btn) {
        const originalText = btn.innerText;
        btn.innerText = '✅ ¡Copiado!';
        setTimeout(() => {
          btn.innerText = originalText;
        }, 2000);
      }
    }).catch(err => {
      console.error('Error al copiar: ', err);
      alert('No se pudo copiar automáticamente. Selecciona el texto manualmente.');
    });
  }
  
  function mostrarMensaje(texto, tipo) {
    const msgDiv = document.getElementById('mensaje');
    msgDiv.innerHTML = texto;
    msgDiv.className = `message ${tipo}`;
    msgDiv.style.display = 'block';
    setTimeout(() => {
      msgDiv.style.display = 'none';
      if (tipo === 'success') msgDiv.innerHTML = '';
    }, 4000);
  }

  /**
 * Cambia entre Registro y Recuperar cita.
 */
function mostrarVistaApp(vista) {

  const vistaRegistro =
    document.getElementById('vistaRegistro');

  const vistaRecuperar =
    document.getElementById('vistaRecuperar');

  const menuRegistro =
    document.getElementById('menuRegistro');

  const menuRecuperar =
    document.getElementById('menuRecuperar');

  if (vista === 'recuperar') {

    vistaRegistro.classList.remove('activa');
    vistaRecuperar.classList.add('activa');

    menuRegistro.classList.remove('activa');
    menuRecuperar.classList.add('activa');

    /*
     * Limpia el componente cada vez que se entra en la vista.
     */
    if (
      typeof rcLimpiarModulo === 'function'
    ) {
      rcLimpiarModulo();
    }

    /*
     * Activa los eventos del componente la primera vez.
     */
    if (
      typeof rcInicializar === 'function'
    ) {
      rcInicializar();
    }

    const input =
      document.getElementById('rcNumero');

    if (input) {
      setTimeout(function() {
        input.focus();
      }, 100);
    }

  } else {

    vistaRecuperar.classList.remove('activa');
    vistaRegistro.classList.add('activa');

    menuRecuperar.classList.remove('activa');
    menuRegistro.classList.add('activa');

  }

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}
